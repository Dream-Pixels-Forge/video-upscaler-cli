[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-upscaler"
version = "0.1.0"
description = "High-precision video upscaler CLI and library using FFmpeg filter pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dream-Pixels-Forge" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.scripts]
video-upscale = "video_upscaler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
